<!DOCTYPE html>
<html lang="en">
    <!--Created by Tivotal-->
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Price Range Bar - Tivotal</title>

        <!--font awesome-->
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
        />

        <!--css file-->
    </head>
    <style>
        /* Created by Tivotal */

        /* Google Fonts(Poppins) */
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap");

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Poppins", sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #4070f4;
        }

        .wrapper {
            width: 400px;
            background-color: #fff;
            padding: 20px 25px 40px;
            border-radius: 10px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .wrapper header h2 {
            font-size: 24px;
            font-weight: 600;
        }

        .wrapper header p {
            font-size: 15px;
            margin-top: 5px;
        }

        .wrapper .price-input {
            display: flex;
            width: 100%;
            margin: 30px 0 35px;
        }

        .wrapper .price-input .field {
            display: flex;
            width: 100%;
            height: 45px;
            align-items: center;
        }

        .price-input input {
            width: 100%;
            height: 100%;
            outline: none;
            border: 1px solid #999;
            border-radius: 5px;
            text-align: center;
            font-size: 18px;
            margin-left: 12px;
        }

        .price-input input::-webkit-outer-spin-button,
        .price-input input::-webkit-inner-spin-button {
            display: none;
        }

        .wrapper .seperator {
            width: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 19px;
        }

        .wrapper .slider {
            height: 5px;
            position: relative;
            background-color: #ddd;
            border-radius: 5px;
        }

        .wrapper .progress {
            position: absolute;
            height: 100%;
            left: 5%;
            right: 65%;
            background-color: #4070f4;
            border-radius: 5px;
        }

        .wrapper .range-input {
            position: relative;
        }

        .wrapper .range-input input {
            position: absolute;
            width: 100%;
            height: 5px;
            top: -5px;
            pointer-events: none;
            background: none;
            appearance: none;
            accent-color: #4070f4;
        }

        .wrapper .range-input input::-webkit-slider-thumb {
            height: 15px;
            width: 15px;
            background-color: #4070f4;
            border-radius: 50%;
            pointer-events: auto;
            box-shadow: 0 0 6px rgba(0, 0, 0, 0.05);
        }
    </style>
    <body>
        <div class="wrapper">
            <header>
                <h2>Price Range</h2>
                <p>Enter or Select min and max price</p>
            </header>
            <div class="price-input">
                <div class="field">
                    <span>Min</span>
                    <input type="number" value="300" class="min-input" />
                </div>
                <div class="seperator">-</div>
                <div class="field">
                    <span>Max</span>
                    <input type="number" value="3500" class="max-input" />
                </div>
            </div>
            <div class="slider">
                <div class="progress"></div>
            </div>
            <div class="range-input">
                <input
                    type="range"
                    min="0"
                    max="10000"
                    value="300"
                    class="min-range"
                />
                <input
                    type="range"
                    min="0"
                    max="10000"
                    value="3500"
                    class="max-range"
                />
            </div>
        </div>

        <script>
            /* Created by Tivotal */

            const priceInputs = document.querySelectorAll(".price-input input");
            const rangeInputs = document.querySelectorAll(".range-input input");
            const range = document.querySelector(".slider .progress");

            let priceGap = 1000;

            priceInputs.forEach((input) => {
                input.addEventListener("input", (e) => {
                    let minPrice = parseInt(priceInputs[0].value);
                    let maxPrice = parseInt(priceInputs[1].value);

                    if (
                        maxPrice - minPrice >= priceGap &&
                        maxPrice <= rangeInputs[1].max
                    ) {
                        if (e.target.className === "min-input") {
                            rangeInputs[0].value = minPrice;
                            range.style.left =
                                (minPrice / rangeInputs[0].max) * 100 + "%";
                        } else {
                            rangeInputs[1].value = maxPrice;
                            range.style.right =
                                100 -
                                (maxPrice / rangeInputs[1].max) * 100 +
                                "%";
                        }
                    }
                });
            });

            rangeInputs.forEach((input) => {
                input.addEventListener("input", (e) => {
                    let minVal = parseInt(rangeInputs[0].value);
                    let maxVal = parseInt(rangeInputs[1].value);

                    if (maxVal - minVal < priceGap) {
                        if (e.target.className === "min-range") {
                            rangeInputs[0].value = maxVal - priceGap;
                        } else {
                            rangeInputs[1].value = minVal + priceGap;
                        }
                    } else {
                        priceInputs[0].value = minVal;
                        priceInputs[1].value = maxVal;
                        range.style.left =
                            (minVal / rangeInputs[0].max) * 100 + "%";
                        range.style.right =
                            100 - (maxVal / rangeInputs[1].max) * 100 + "%";
                    }
                });
            });
        </script>
    </body>
</html>
